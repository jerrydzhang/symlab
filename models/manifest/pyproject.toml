[project]
name = "manifest"
version = "0.1.0"
description = "temp name until we figure out what to call this package"
requires-python = ">=3.13"
dependencies = [
    "symbolic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manifest"]

[tool.uv.sources]
symbolic = { workspace = true }
