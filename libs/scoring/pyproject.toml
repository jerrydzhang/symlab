[project]
name = "scoring"
version = "0.1.0"
description = "Standalone scorer functions for symlab"
requires-python = ">=3.13"
dependencies = [
    "symbolic",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoring"]

[tool.uv.sources]
symbolic = { workspace = true }
