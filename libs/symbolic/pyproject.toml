[project]
name = "symbolic"
version = "0.1.0"
description = "Substrate library for neural symbolic-regression research: data, eval, constants, equivalence. Framework-agnostic."
requires-python = ">=3.13"
dependencies = [
    "sympy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/symbolic"]
