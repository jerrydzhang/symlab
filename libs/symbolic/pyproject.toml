[project]
name = "symbolic"
version = "0.1.0"
description = "Substrate library symbolic-regression"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
    "sympy>=1.14.0",
    "scipy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/symbolic"]
