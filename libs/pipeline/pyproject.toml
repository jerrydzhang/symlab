[project]
name = "pipeline"
version = "0.1.0"
description = "Composable data generation pipeline for symlab"
requires-python = ">=3.13"
dependencies = [
    "symbolic",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.uv.sources]
symbolic = { workspace = true }
