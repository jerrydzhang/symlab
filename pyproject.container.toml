# Container-only pyproject for symlab.
#
# symlab's root pyproject.toml uses path deps to a sibling jernerics checkout
# (../jernerics/packages/...) for local dev ergonomics. That path does not
# exist inside the Apptainer build context, so this file replaces those path
# sources with git sources (jernerics@beads-test, which carries the
# context-dimension tracking model the experiment uses).
#
# Python/CUDA choice:
#   - manifest and symbolic both require-python >=3.13, so the base image must
#     be python:3.13 (3.12 is unsatisfiable).
#   - pytorch-cu118 ships torch>=2.6 with cp313 wheels and a relaxed sympy pin
#     (>=1.13.1, compatible with symbolic's sympy>=1.14.0). cu124 tops out at
#     torch 2.5.1 (hard-pins sympy==1.13.1, unsatisfiable) and has no cp313.
#   - CUDA 11.8 runs on any driver >= R520 (HPC modules top at 12.3; the local
#     cu130 build would not run on the GPU nodes). A100/SM_80 fully supported.
#
# requires-python stays >=3.13 (matching manifest/symbolic). container.def sets
# UV_PYTHON_PREFERENCE=only-system so uv 0.11+ uses the base image's 3.13
# interpreter instead of fetching a managed 3.14 (torch cu118 has no cp314).
#
# symbolic and manifest are workspace members installed at build time with
# --no-editable (wheels in site-packages). At runtime, PYTHONPATH in
# container.def's %environment points at /work/libs/symbolic/src and
# /work/models/manifest/src, which shadow the baked copies. This means library
# code changes take effect on project sync without a container rebuild, while
# the baked copies guarantee the container still works if /work is stale.
#
# Workspace narrowed to only what the experiment imports (symbolic, manifest);
# libs/srbench and experiments/* are excluded -- the overfit trial does not use
# them and srbench's dep tree is irrelevant here.
#
# container.def copies this file into the image as /build/project/pyproject.toml.

[project]
name = "symlab"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "jernerics",
    "jernerics-server",
    "manifest",
    "torch",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/symbolic", "models/manifest"]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
symbolic = { workspace = true }
manifest = { workspace = true }
jernerics = { git = "https://github.com/jerrydzhang/jernerics.git", branch = "beads-test", subdirectory = "packages/jernerics" }
jernerics-server = { git = "https://github.com/jerrydzhang/jernerics.git", branch = "beads-test", subdirectory = "packages/jernerics-server" }
torch = { index = "pytorch-cu118" }
