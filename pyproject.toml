[project]
name = "symlab"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "jernerics",
    "jernerics-server",
    "manifest",
    "marimo>=0.23.14",
    "matplotlib>=3.11.1",
    "torch>=2.11.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.workspace]
members = ["libs/*", "models/*", "experiments/baselines"]

[tool.uv.sources]
symbolic = { workspace = true }
manifest = { workspace = true }
jernerics = { git = "https://github.com/jerrydzhang/jernerics.git", branch = "main", subdirectory = "packages/jernerics" }
jernerics-server = { git = "https://github.com/jerrydzhang/jernerics.git", branch = "main", subdirectory = "packages/jernerics-server" }
torch = { index = "pytorch-cu128" }

[tool.jernerics]
tracking_server = "https://atlas.taile454b.ts.net"

[tool.jernerics.backends.hpc]
type = "slurm"
host = "jez21005@hpc2.storrs.hpc.uconn.edu"
remote_dir = "~/projects/symlab-overfit"
cache_dir = "/scratch/qiy18011/jez21005/jernerics/{project_name}"
container_type = "apptainer"
heartbeat_interval_s = 30
stale_after_s = 180
grace_period_s = 60
max_retries = 2

[tool.jernerics.backends.hpc.slurm]
# Build job runs on the CPU priority partition. Trial sweeps override to a GPU
# partition via backend_overrides in their experiments/configs/*.py config.
partition = "priority"
time = "0:30:00"
mem = "32G"
cpus = 4

[tool.jernerics.backends.hpc.apptainer]
build_dir = "/dev/shm/build/{project_name}"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "ty>=0.0.56",
]

[tool.ruff.lint.per-file-ignores]
# Vendored SRBench upstream: pinned third-party code we don't modify
# (refresh.sh validates the import cluster is closed). Lint is not actionable.
"libs/srbench/src/srbench/srbench_upstream/**" = ["F401", "E402", "F541", "F841", "E711"]

[tool.ty.src]
# Same vendored cluster: imports resolve only via runtime sys.path
# manipulation, so static analysis cannot (and should not) resolve them.
exclude = ["libs/srbench/src/srbench/srbench_upstream/**"]
