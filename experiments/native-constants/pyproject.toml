[project]
name = "native-constants"
version = "0.1.0"
description = "h1 — native continuous constants via a mixed discrete/continuous output head (primer hypothesis)."
requires-python = ">=3.13"
dependencies = [
    "symbolic",
]

[tool.uv.sources]
symbolic = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/native_constants"]
