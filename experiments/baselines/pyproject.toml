[project]
name = "baselines"
version = "0.1.0"
description = "Baseline SR methods wrapped for the official SRBench evaluation pipeline."
requires-python = ">=3.13"
dependencies = [
    "pandas<3",
    "pysr>=1.5.10",
    "srbench",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baselines"]

[tool.uv.sources]
srbench = { workspace = true }
